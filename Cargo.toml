[workspace]
members = ["core", "app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Debian 13 ships Rust 1.85; nothing newer is needed yet.
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
sofa-core = { path = "core" }
url = "2.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# Packagers keep or strip symbols themselves.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
