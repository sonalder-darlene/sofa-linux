[workspace]
members = ["core", "app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# adblock needs 1.87 (`is_multiple_of`). Debian 13 gets a newer Rust than its own 1.85 from rustc-web (sofa.sh deps).
rust-version = "1.87"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
sofa-core = { path = "core" }
url = "2.5"
serde_json = "1"
# Brave's ad-blocking engine. Without its "single-thread" feature, so one engine serves every thread.
adblock = { version = "0.13.6", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
# Mozilla's Public Suffix List, to tell sites apart (already in the build through adblock).
psl = "2.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# Packagers keep or strip symbols themselves.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
