[package]
name = "sofa-tv-browser"
description = "Sofa for Linux: a TV web browser for KDE Plasma Bigscreen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
sofa-core.workspace = true
# Must be the version of cxx-gen that cxx-qt-build generates the C++ side with (see Cargo.lock): the symbol
# names carry it.
cxx = "=1.0.198"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde_json.workspace = true
url.workspace = true

[build-dependencies]
cxx-qt-build = "0.10"

[lints]
workspace = true
